[package]
name = "desktop-node"
version = "0.1.0"
edition = "2021"

[dependencies]
span-core = { path = "../../crates/span-core", features = ["opus"] }
span-capture = { path = "../../crates/span-capture" }
span-transport = { path = "../../crates/span-transport" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
