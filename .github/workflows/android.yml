name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" && yes | sdkmanager --licenses > /dev/null

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust library for Android
        working-directory: targets/android-client
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --release

      - name: Build APK
        working-directory: targets/android-client/android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --stacktrace && exit 0
            echo "gradle attempt $i failed, retrying"
            sleep 10
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonicspan-android-debug-apk
          path: targets/android-client/android/app/build/outputs/apk/debug/*.apk
