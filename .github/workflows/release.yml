name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build packages and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA development files
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build desktop-node (release)
        run: cargo build --release --bin desktop-node

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Build web client
        working-directory: targets/wasm-client
        run: wasm-pack build --target web --out-dir web/pkg

      - name: Package release artifacts
        run: |
          mkdir -p dist/stage
          cp target/release/desktop-node dist/stage/
          cp LICENSE README.md dist/stage/
          tar -czf "dist/sonicspan-desktop-node-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C dist/stage .
          (cd targets/wasm-client/web && zip -qr "../../../dist/sonicspan-web-client-${GITHUB_REF_NAME}.zip" .)

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          LOG=$(mktemp)
          set +e
          # Delete stale releases left behind when the tag was re-created.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "'"$GITHUB_REF_NAME"'" or .tag_name == "" or .tag_name == null) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null 2>&1 || true
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md >>"$LOG" 2>&1
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber >>"$LOG" 2>&1
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "SonicSpan $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md >>"$LOG" 2>&1
          fi
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error title=gh release failed ($RC)::$(tail -c 2000 "$LOG")"
            exit $RC
          fi
          gh release view "$GITHUB_REF_NAME" --json tagName,assets --jq '.tagName + " assets=" + (.assets|length|tostring)'

  windows:
    name: Build Windows package
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install ninja
        run: choco install ninja -y --no-progress

      - name: Build desktop-node (release)
        shell: pwsh
        run: |
          cargo build --release --bin desktop-node 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log

      - name: Report build failure
        if: failure()
        shell: pwsh
        run: |
          $log = Get-Content build.log -Tail 80 -ErrorAction SilentlyContinue
          $msg = ($log -join "`n")
          if ($msg) { Write-Output "::error title=Windows build failed::$msg" }

      - name: Package release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item target/release/desktop-node.exe dist/stage/
          Copy-Item LICENSE, README.md dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/sonicspan-desktop-node-$env:GITHUB_REF_NAME-windows-x86_64.zip"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          LOG=$(mktemp)
          set +e
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "'"$GITHUB_REF_NAME"'" or .tag_name == "" or .tag_name == null) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null 2>&1 || true
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber >>"$LOG" 2>&1
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "SonicSpan $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md >>"$LOG" 2>&1
          fi
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error title=gh release failed ($RC)::$(tail -c 2000 "$LOG")"
            exit $RC
          fi
          gh release view "$GITHUB_REF_NAME" --json tagName,assets --jq '.tagName + " assets=" + (.assets|length|tostring)'

  android:
    name: Build Android APK
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" && yes | sdkmanager --licenses > /dev/null

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust library for Android
        working-directory: targets/android-client
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --release

      - name: Build release APK
        working-directory: targets/android-client/android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleRelease --stacktrace && exit 0
            echo "gradle attempt $i failed, retrying"
            sleep 10
          done
          exit 1

      - name: Package release artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/sonicspan-android-${GITHUB_REF_NAME}.apk"
        working-directory: targets/android-client

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          LOG=$(mktemp)
          set +e
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "'"$GITHUB_REF_NAME"'" or .tag_name == "" or .tag_name == null) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null 2>&1 || true
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber >>"$LOG" 2>&1
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "SonicSpan $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md >>"$LOG" 2>&1
          fi
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error title=gh release failed ($RC)::$(tail -c 2000 "$LOG")"
            exit $RC
          fi
          gh release view "$GITHUB_REF_NAME" --json tagName,assets --jq '.tagName + " assets=" + (.assets|length|tostring)'
